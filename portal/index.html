<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brother Portal | Home</title>
  <link rel="icon" type="image/x-icon" href="../Images/ThetaTau.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/portal.css?v=35">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style id="auth-wall">.auth-pending>header,.auth-pending>main,.auth-pending>.portal-container{display:none!important}.auth-spinner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f5f5;z-index:9999}.auth-spinner .sp{width:40px;height:40px;border:4px solid #eee;border-top-color:#8B0000;border-radius:50%;animation:authspin .7s linear infinite}@keyframes authspin{to{transform:rotate(360deg)}}</style>
</head>
<body class="auth-pending">
  <div class="auth-spinner" id="auth-spinner"><div class="sp"></div></div>
  <header class="portal-header">
    <div class="header-brand"><a href="/portal" class="logo-link"><img src="../Images/ThetaTau.png" alt="ΘΤ"></a><h1>ΘΤ ΖΔ Brother Portal</h1></div>
    <div class="user-info">
      <div class="nav-dropdown hidden" id="ops-dropdown">
        <button type="button" class="nav-dropdown-toggle nav-dropdown-toggle--ops" id="ops-dd-toggle">Chapter Ops</button>
        <div class="nav-dropdown-menu" id="ops-dd-menu"></div>
      </div>
      <div class="nav-dropdown hidden" id="admin-dropdown">
        <button type="button" class="nav-dropdown-toggle nav-dropdown-toggle--admin" id="admin-dd-toggle">Admin</button>
        <div class="nav-dropdown-menu" id="admin-dd-menu"></div>
      </div>
      <div class="nav-dropdown" id="nav-dropdown">
        <button type="button" class="nav-dropdown-toggle" id="dd-toggle"><span id="user-name">Menu</span></button>
        <div class="nav-dropdown-menu" id="dd-menu"></div>
      </div>
    </div>
  </header>

  <main class="portal-container">
    <div id="banner-active-poll" class="banner-active-poll hidden">
      <a href="voting">An active poll is open. Vote here.</a>
    </div>

    <div class="portal-card" id="greeting-card">
      <h2 id="greeting">Hi</h2>
      <p id="greeting-sub" style="color:#666; margin-bottom:0;">Welcome back.</p>
      <div class="stat-grid hidden" id="stat-grid">
        <div class="stat-tile" id="stat-balance">
          <span class="stat-label">Balance due</span>
          <span class="stat-value">—</span>
        </div>
        <div class="stat-tile" id="stat-service">
          <span class="stat-label">Service hours</span>
          <span class="stat-value">—</span>
        </div>
        <div class="stat-tile" id="stat-demerits">
          <span class="stat-label">Demerits</span>
          <span class="stat-value">—</span>
        </div>
      </div>
      <p id="stat-status" style="color:#999; font-size:0.85rem; margin:0.75rem 0 0;"></p>
    </div>

    <!-- Link tiles: rendered by js/portal-links-core.js from portalLinks/ (edited at portal-links by admins).
         While the Tracker sheet is the record, the excuse and service tiles go to the Google Forms. -->
    <div id="link-sections"></div>

    <!-- Officers only: the Chapter Ops pages, a read-only copy of the Tracker sheet for now. -->
    <div class="portal-card hidden" id="officer-card">
      <h2 id="officer-title">Officer preview</h2>
      <div id="officer-banner" hidden></div>
      <div class="portal-nav-grid" id="officer-links"></div>
      <p class="officer-note" id="officer-note">Only officers see this card. Brothers still use the Theta Tau Tracker.</p>
    </div>

    <div class="portal-card">
      <h2>Chapter Calendar</h2>
      <div class="calendar-embed">
        <iframe
          id="chapter-calendar"
          data-calendar-src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FNew_York&showPrint=0&title=Theta%20Tau%20Zeta%20Delta%20Calendar&src=dGhldGF0YXVjYWxlbmRhcjlAZ21haWwuY29t&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&src=OXNrZDhianI3cXFqZXJhN2cxNHRrczRhanVoOXVyZ2NAaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%238B0000&color=%230b8043&color=%23ef6c00"
          frameborder="0"
          scrolling="no"
          loading="lazy">
        </iframe>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=35"></script>
  <script src="js/auth.js?v=35"></script>
  <script src="js/ops-core.js?v=35"></script>
  <script src="js/ops-db.js?v=35"></script>
  <script src="js/ops-mode.js?v=35"></script>
  <script src="js/db.js?v=35"></script>
  <script src="js/tracker.js?v=35"></script>
  <script src="js/portal-links-core.js?v=35"></script>
  <script>
    (function() {
      'use strict';

      // The site's own excuse and service pages, and the Google Form each one stands in for.
      var FORM_PAGES = { 'excuse': 'excuse', 'log-service': 'service' };
      // The names brothers knew on this page before Chapter Ops.
      var SHEET_LABELS = { 'Excused Absence Request': 'Excused Absence Form', 'Log Service Hours': 'Service Hours Form' };
      // The Forms card order before Chapter Ops. Used only while the links are the built-in set.
      var SHEET_FORMS_ORDER = { suggest: 1, excuse: 2, service: 3, report: 4, concern: 5 };
      var OFFICER_ICONS = { 'tracker-preview': 'chart', attendance: 'calendar', 'standards-board': 'gavel', treasurer: 'dollar',
        service: 'heart', marshal: 'star', semester: 'calendar', settings: 'grid' };

      function pageOf(url) { return String(url == null ? '' : url).trim().replace(/\/+$/, ''); }

      /**
       * While the Tracker sheet is the record: links to the site's excuse and service pages
       * go to the Google Forms instead (OpsMode.formUrl), under their old names, and a form
       * that is already its own tile shows once. Pure: returns a new sections object.
       */
      function sheetSections(sections, mode, isDefault) {
        var out = {}, seen = {};
        Object.keys(sections || {}).forEach(function(sid) {
          var links = (sections[sid] || {}).links || {};
          Object.keys(links).forEach(function(lid) {
            var l = links[lid] || {};
            if (!l.hidden && !FORM_PAGES[pageOf(l.url)]) seen[pageOf(l.url)] = true;
          });
        });
        Object.keys(sections || {}).forEach(function(sid) {
          var sec = sections[sid] || {}, links = {};
          Object.keys(sec.links || {}).forEach(function(lid) {
            var l = Object.assign({}, sec.links[lid]);
            var kind = FORM_PAGES[pageOf(l.url)];
            if (kind) {
              l.url = OpsMode.formUrl(kind, mode);
              if (seen[pageOf(l.url)]) return;
              seen[pageOf(l.url)] = true;
              if (SHEET_LABELS[l.label]) l.label = SHEET_LABELS[l.label];
            }
            if (isDefault && sid === 'forms' && SHEET_FORMS_ORDER[lid]) l.order = SHEET_FORMS_ORDER[lid];
            links[lid] = l;
          });
          out[sid] = Object.assign({}, sec, { links: links });
        });
        return out;
      }

      /** Officers: one tile per Chapter Ops page they can open, under the preview notice. */
      function renderOfficerCard(profile, mode) {
        if (!PortalAuth.isOfficer(profile)) return;
        var items = PortalAuth.visibleNav('ops', profile).filter(function(it) { return it.href && !it.section; });
        if (!items.length) return;
        var sheet = !window.OpsMode || OpsMode.isSheet(mode);
        document.getElementById('officer-title').textContent = sheet ? 'Officer preview' : 'Officer tools';
        document.getElementById('officer-note').classList.toggle('hidden', !sheet);
        if (window.OpsMode) OpsMode.banner(document.getElementById('officer-banner'), mode);
        var grid = document.getElementById('officer-links');
        grid.innerHTML = '';
        items.forEach(function(it) {
          var a = document.createElement('a');
          var external = /^https:/.test(it.href);
          a.href = it.href;
          if (external) { a.target = '_blank'; a.rel = 'noopener'; }
          a.innerHTML = PortalLinks.iconSvg(OFFICER_ICONS[it.href] || (external ? 'doc' : 'link'));
          var span = document.createElement('span');
          span.textContent = it.label;
          a.appendChild(span);
          grid.appendChild(a);
        });
        document.getElementById('officer-card').classList.remove('hidden');
      }

      // No refresh from the sheet runs here: a quiet one could be cut off by the next tap and leave a partial
      // copy. It runs on the officer preview pages and on Refresh from sheet, where the banner shows progress.

      window.PortalHome = { sheetSections: sheetSections };

      PortalAuth.requireAuth({ page: '', forcePortalHome: true }).then(function(profile) {
        if (!profile) return;
        PortalAuth.initNav(profile);

        var fullName = (profile.name || '').replace(/\s+/g, ' ').trim();
        document.getElementById('greeting').textContent = 'Hi ' + (fullName || 'Brother') + '!';

        var bits = [];
        if (profile.rollNumber) bits.push('Roll #' + profile.rollNumber);
        if (profile.role && profile.role !== 'brother') bits.push(profile.role.replace('_', ' '));
        document.getElementById('greeting-sub').textContent = bits.length ? bits.join(' · ') : 'Welcome back.';

        var cal = document.getElementById('chapter-calendar');
        var modeReady = window.OpsMode ? OpsMode.load() : Promise.resolve(null);
        Promise.all([PortalLinks.load(), modeReady]).then(function(r) {
          var cfg = r[0], mode = r[1];
          var sections = cfg.sections;
          if (window.OpsMode && OpsMode.isSheet(mode)) sections = sheetSections(sections, mode, cfg.isDefault);
          PortalLinks.render(document.getElementById('link-sections'), sections, profile);
          setCalendar(cfg.calendarUrl && /^https:\/\/calendar\.google\.com\//.test(cfg.calendarUrl) ? cfg.calendarUrl : cal.getAttribute('data-calendar-src'));
          renderOfficerCard(profile, mode);
        });

        // Balance, service hours and demerits come live from the Tracker sheet (js/tracker.js).
        if (window.PortalTracker) {
          PortalTracker.renderHomeStats(profile);
        } else {
          document.getElementById('stat-status').textContent =
            'Theta Tau Tracker is not connected yet.';
        }
      });

      // Month grid is unreadable on a phone. Load the calendar in agenda mode there instead.
      function setCalendar(src) {
        var el = document.getElementById('chapter-calendar');
        if (el && src) el.src = window.matchMedia('(max-width: 768px)').matches ? src + '&mode=AGENDA' : src;
      }
    })();
  </script>
</body>
</html>
