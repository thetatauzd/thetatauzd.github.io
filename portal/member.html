<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tracker</title>
  <link rel="icon" type="image/x-icon" href="../Images/ThetaTau.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/portal.css?v=24">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style id="auth-wall">.auth-pending>header,.auth-pending>main,.auth-pending>.portal-container{display:none!important}.auth-spinner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f5f5;z-index:9999}.auth-spinner .sp{width:40px;height:40px;border:4px solid #eee;border-top-color:#8B0000;border-radius:50%;animation:authspin .7s linear infinite}@keyframes authspin{to{transform:rotate(360deg)}}</style>
</head>
<body class="auth-pending">
  <div class="auth-spinner" id="auth-spinner"><div class="sp"></div></div>
  <header class="portal-header">
    <div class="header-brand"><a href="/portal" class="logo-link"><img src="../Images/ThetaTau.png" alt="ΘΤ"></a><h1>My Tracker</h1></div>
    <div class="user-info">
      <div class="nav-dropdown hidden" id="ops-dropdown">
        <button type="button" class="nav-dropdown-toggle nav-dropdown-toggle--ops" id="ops-dd-toggle">Chapter Ops</button>
        <div class="nav-dropdown-menu" id="ops-dd-menu"></div>
      </div>
      <div class="nav-dropdown hidden" id="admin-dropdown">
        <button type="button" class="nav-dropdown-toggle nav-dropdown-toggle--admin" id="admin-dd-toggle">Admin</button>
        <div class="nav-dropdown-menu" id="admin-dd-menu"></div>
      </div>
      <div class="nav-dropdown" id="nav-dropdown">
        <button type="button" class="nav-dropdown-toggle" id="dd-toggle"><span id="user-name">Menu</span></button>
        <div class="nav-dropdown-menu" id="dd-menu"></div>
      </div>
    </div>
  </header>

  <main class="portal-container ops-section">
    <p id="page-status" class="step-hint">Loading…</p>
    <div id="page-body" class="hidden">
      <div class="portal-card">
        <div class="connected-head">
          <div><h2 style="margin:0;" id="m-name">—</h2><p class="step-hint" id="m-sub" style="margin:0.15rem 0 0;"></p></div>
          <select id="m-term" class="field" style="max-width:150px;"></select>
        </div>
        <div class="stat-grid" id="m-tiles" style="margin-top:0.75rem;"></div>
        <p class="step-hint" id="m-scope"></p>
      </div>
      <div class="live-grid">
        <div class="live-main">
          <div class="portal-card hidden" id="sec-timeline"><h2>Demerit history</h2><ul class="timeline" id="m-timeline"></ul></div>
          <div class="portal-card hidden" id="sec-attendance"><h2>Attendance <span class="count-pill" id="m-free"></span></h2><div class="table-scroll"><table class="admin-table"><thead><tr><th>Event</th><th>Date</th><th>Type</th><th>Mark</th></tr></thead><tbody id="m-att"></tbody></table></div></div>
          <div class="portal-card hidden" id="sec-excuses"><h2>Excuse requests</h2><div id="m-excuses"></div><p class="step-hint">Rule on these from the <a href="standards-board#excuses">Standards Board</a>.</p></div>
        </div>
        <div class="live-side">
          <div class="portal-card hidden" id="sec-ledger"><h2>Dues &amp; fees <span class="count-pill" id="m-balance"></span></h2><div class="table-scroll"><table class="admin-table"><thead><tr><th>Item</th><th>Amount</th><th>Due</th><th>Status</th><th>Left</th></tr></thead><tbody id="m-ledger"></tbody></table></div><p class="step-hint">Record payments, waivers and plans from the <a href="treasurer">Treasurer</a> page.</p></div>
          <div class="portal-card hidden" id="sec-service"><h2>Service hours <span class="count-pill" id="m-svc"></span></h2><div id="m-service"></div><p class="status-line" id="m-svc-status"></p></div>
          <div class="portal-card hidden" id="sec-status"><h2>Status history</h2><div id="m-status"></div></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=24"></script>
  <script src="js/auth.js?v=24"></script>
  <script src="js/ops-core.js?v=24"></script>
  <script src="js/ops-db.js?v=24"></script>
  <script src="js/ops-photos.js?v=24"></script>
  <script src="js/member.js?v=24"></script>
</body>
</html>
